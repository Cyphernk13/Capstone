name: Project 12 CI Implementation



on:

  push:

    branches: [ main ]

    # Only trigger if changes happen in the project12 folder

    paths:

      - 'project12/**'

  pull_request:

    branches: [ main ]

    paths:

      - 'project12/**'



jobs:

  terraform:

    name: Terraform CI Check

    runs-on: ubuntu-latest



    # CRITICAL: Tell it to run inside the project12 folder

    defaults:

      run:

        working-directory: ./project12



    steps:

      - name: Checkout

        uses: actions/checkout@v4



      - name: Setup Terraform

        uses: hashicorp/setup-terraform@v3



      - name: Terraform Init

        run: terraform init -backend=false



      - name: Terraform Format

        run: terraform fmt -check



      - name: Terraform Validate

        run: terraform validate
